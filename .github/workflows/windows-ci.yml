name: Windows build, safety tests and UI smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scale:
        description: Include synthetic 10k/100k/1M catalog tests
        type: boolean
        default: false
      background_soak_seconds:
        description: In-process mixed-media background soak (30..14400 seconds; 7200 for two hours)
        type: number
        default: 30
      performance_million:
        description: Also compare baseline/current WPF and SQL with 1M synthetic catalog records
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ inputs.background_soak_seconds || 30 }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up repository validator
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build, test, publish and exercise isolated main window
        shell: pwsh
        env:
          PHOTOSHELF_SOAK_SECONDS: ${{ inputs.background_soak_seconds || 30 }}
        run: ./tools/harness.ps1 -BackgroundSoakSeconds ([int]$env:PHOTOSHELF_SOAK_SECONDS)
      - name: Preserve test results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results-${{ github.sha }}
          path: TestResults/windows-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve verified Windows package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PhotoShelf-win-x64-${{ github.sha }}
          path: |
            artifacts/windows-*/*.zip
            artifacts/windows-*/*.sha256
          if-no-files-found: error
          retention-days: 14

  scale:
    name: Bounded synthetic catalog scale tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scale == true }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up result validator
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Exercise isolated journals and large catalogs
        shell: pwsh
        env:
          PHOTOSHELF_SCALE_DIAGNOSTICS: ${{ github.workspace }}/TestResults/scale
          PHOTOSHELF_SCALE_DATA_ROOT: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $results = 'TestResults/scale'
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          $failed = $false
          foreach ($project in @('Application', 'Infrastructure.Sqlite')) {
            $path = "tests/PhotoShelf.$project.Tests/PhotoShelf.$project.Tests.csproj"
            dotnet restore $path --locked-mode --disable-parallel
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
            dotnet test $path -c Release --no-restore -m:1 -nr:false -p:UseSharedCompilation=false `
              --filter 'Category=CatalogScale' --results-directory $results `
              --logger "trx;LogFileName=$project.trx" --logger 'console;verbosity=normal' `
              --blame-hang-timeout 15m --blame-hang-dump-type none
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          python tools/harness_checks.py trx $results --projects Application Infrastructure.Sqlite --summary "$results/summary.json"
          if ($LASTEXITCODE -ne 0 -or $failed) { throw 'Scale tests failed or did not complete.' }
      - name: Preserve scale results and active-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-scale-${{ github.sha }}
          path: TestResults/scale/
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Same-host baseline/current performance
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out current source and pinned baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up comparison reporter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Compare four fresh processes on this same host
        shell: pwsh
        env:
          PHOTOSHELF_PERFORMANCE_MILLION: ${{ inputs.performance_million == true }}
        run: ./scripts/compare-windows-performance.ps1 -Million:($env:PHOTOSHELF_PERFORMANCE_MILLION -eq 'true')
      - name: Preserve raw measurements, machine metadata and comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-performance-${{ github.sha }}
          path: TestResults/performance-*/
          if-no-files-found: error
          retention-days: 30
